<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Inicia Sesión</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-image: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 60%, rgba(0, 0, 0, 0.8) 100%), url('https://assets.nflxext.com/ffe/siteui/vlv3/f847d322-3ed7-4d0d-8054-4f056461ba15/d25e01f1-d5b0-4660-8822-29f928e4e941/US-en-20231120-popsignuptwoweeks-perspective_alpha_website_large.jpg'); background-size: cover; background-position: center; min-height: 100vh;">

  <!-- Contenedor Principal -->
  <table role="presentation" width="100%" height="100%" border="0" cellspacing="0" cellpadding="0" style="min-height: 100vh;">
    <tr>
      <td align="center" valign="top" style="padding: 20px;">
        
        <!-- Encabezado / Logo -->
        <table role="presentation" width="100%" max-width="1000" border="0" cellspacing="0" cellpadding="0" style="max-width: 1000px; margin-bottom: 20px;">
          <tr>
            <td align="left" style="padding: 10px 0;">
              <span style="color: #e50914; font-size: 32px; font-weight: bold; letter-spacing: -1px; font-family: 'Arial Black', sans-serif;">NETFLIX</span>
            </td>
          </tr>
        </table>

        <!-- Tarjeta de Login -->
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 450px; background-color: rgba(0, 0, 0, 0.75); border-radius: 8px; padding: 60px 68px 40px 68px; box-sizing: border-box;">
          <tr>
            <td>
              <h1 style="color: #ffffff; font-size: 32px; font-weight: 700; margin-top: 0; margin-bottom: 28px;">Inicia sesión</h1>

              <form action="#" method="POST" onsubmit="alert('¡Alerta de phishing! En una situación real, este sitio falso habría capturado tu contraseña y correo de Netflix.'); return false;">
                <!-- Campo Email / Teléfono -->
                <div style="margin-bottom: 16px;">
                  <input type="text" placeholder="Email o número de teléfono" style="width: 100%; height: 50px; padding: 16px 20px; background-color: #333333; border: none; border-radius: 4px; color: #ffffff; font-size: 16px; box-sizing: border-box; outline: none;">
                </div>

                <!-- Campo Contraseña -->
                <div style="margin-bottom: 40px;">
                  <input type="password" placeholder="Contraseña" style="width: 100%; height: 50px; padding: 16px 20px; background-color: #333333; border: none; border-radius: 4px; color: #ffffff; font-size: 16px; box-sizing: border-box; outline: none;">
                </div>

                <!-- Botón de Inicio de Sesión -->
                <button type="submit" style="width: 100%; height: 48px; background-color: #e50914; color: #ffffff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;">
                  Iniciar sesión
                </button>
              </form>

              <!-- Opciones adicionales -->
              <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 12px; margin-bottom: 40px;">
                <tr>
                  <td align="left">
                    <label style="color: #b3b3b3; font-size: 13px; cursor: pointer;">
                      <input type="checkbox" checked style="accent-color: #737373; margin-right: 5px;"> Recuérdame
                    </label>
                  </td>
                  <td align="right">
                    <a href="#" style="color: #b3b3b3; font-size: 13px; text-decoration: none;">¿Necesitas ayuda?</a>
                  </td>
                </tr>
              </table>

              <!-- Registro / Pie de la tarjeta -->
              <div style="color: #737373; font-size: 16px; margin-bottom: 12px;">
                ¿Primera vez en Netflix? <a href="#" style="color: #ffffff; text-decoration: none; font-weight: 500;">Suscríbete ahora</a>.
              </div>

              <div style="color: #8c8c8c; font-size: 13px; line-height: 1.4;">
                Esta página está protegida por Google reCAPTCHA para comprobar que no eres un robot.
              </div>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
